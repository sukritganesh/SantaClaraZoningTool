name: Residential release validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: residential-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.9 clean-checkout gate
    # setup-python provides the Python 3.9 Linux build for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.1

      - name: Set up Python 3.9
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Restore and reverify runtime data
        run: |
          python -B scripts/bootstrap_demo_data.py
          python -B scripts/bootstrap_demo_data.py

      - name: Reproduce the residential runtime bundle
        run: |
          python -B scripts/build_residential_demo_data_bundle.py
          git diff --exit-code -- \
            demo-data/residential-bundle-manifest-2026-07-19.2.json \
            demo-data/santa-clara-residential-runtime-data-2026-07-19.2.zip

      - name: Validate exact source evidence
        run: python -B scripts/build_source_evidence.py --validate-only

      - name: Validate zone descriptions
        run: python -B scripts/validate_zone_descriptions.py

      - name: Validate approved residential rules
        run: >-
          python -B scripts/validate_approved_residential_rules.py
          --verify-source-files

      - name: Validate residential result contracts
        run: |
          python -B scripts/validate_residential_result_contract.py
          python -B scripts/validate_residential_result_contract_v2_1.py

      - name: Run the residential release harness
        run: python -B -m unittest tests.test_residential_vertical_slice -v

      - name: Run the complete repository suite
        run: python -B -m unittest discover -s tests -q

      - name: Check JavaScript syntax and whitespace integrity
        run: |
          node --check santa_clara_zoning/static/app.js
          git diff --check
